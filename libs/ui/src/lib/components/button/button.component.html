<ng-template #inner>
  @if (loading()) {
    <span [class]="loadingClass()" data-testid="lib-button-spinner" aria-hidden="true"></span>
  }
  <ng-content />
</ng-template>

@if (routerLink()) {
  <a
    #nativeButtonRef
    [class]="buttonClass()"
    libDsLift
    [routerLink]="routerLink()"
    [attr.title]="resolvedTitle()"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-expanded]="ariaExpanded() ?? null"
    [attr.aria-pressed]="ariaPressed() ?? null"
    [attr.aria-controls]="ariaControls() ?? null"
    (click)="clicked.emit()"
  >
    <ng-container [ngTemplateOutlet]="inner" />
  </a>
} @else if (href()) {
  <a
    #nativeButtonRef
    [class]="buttonClass()"
    libDsLift
    [href]="href()"
    [attr.title]="resolvedTitle()"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-expanded]="ariaExpanded() ?? null"
    [attr.aria-pressed]="ariaPressed() ?? null"
    [attr.aria-controls]="ariaControls() ?? null"
    (click)="clicked.emit()"
  >
    <ng-container [ngTemplateOutlet]="inner" />
  </a>
} @else {
  <button
    #nativeButtonRef
    [class]="buttonClass()"
    libDsLift
    [type]="type()"
    [disabled]="isDisabled()"
    [attr.title]="resolvedTitle()"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-expanded]="ariaExpanded() ?? null"
    [attr.aria-pressed]="ariaPressed() ?? null"
    [attr.aria-controls]="ariaControls() ?? null"
    (click)="clicked.emit()"
  >
    <ng-container [ngTemplateOutlet]="inner" />
  </button>
}
