<div class="flex flex-col items-center justify-center py-12 text-center" role="status">
  @if (icon()) {
    <lucide-icon [img]="icon()" [size]="48" class="text-base-content/30 mb-4" aria-hidden="true" />
  }
  <p class="text-base-content/60 text-sm">{{ message() }}</p>
  @if (actionLabel()) {
    <button type="button" class="btn btn-primary btn-sm mt-4" (click)="clicked.emit()">
      {{ actionLabel() }}
    </button>
  }
</div>
