<lib-form-field [label]="label()" [hint]="hint()" [errorText]="errorText()" [required]="required()" [size]="size()" [id]="inputId()">
  <div [class]="boxClasses()">
    @if (icon()) {
      <lucide-icon [img]="icon()" [size]="16" class="text-base-content/40 shrink-0" data-testid="lib-input-icon" />
    }
    <input
      #nativeInputRef
      [id]="inputId()"
      class="grow w-full min-w-0 bg-transparent outline-none min-h-6"
      [type]="effectiveType()"
      [placeholder]="placeholder() ?? ''"
      [value]="value()"
      [disabled]="isDisabled()"
      [required]="required()"
      [attr.min]="min() ?? null"
      [attr.max]="max() ?? null"
      [attr.maxlength]="maxLength() ?? null"
      [attr.autocomplete]="autocomplete() ?? null"
      [attr.name]="name() ?? null"
      [readOnly]="readonly()"
      [attr.aria-label]="ariaLabel() ?? null"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [attr.aria-describedby]="hasDescription() ? descriptionId() : null"
      (input)="onInput($event)"
      (blur)="onBlur()"
      data-testid="lib-input-native"
    />
    @if (isPassword() && !readonly()) {
      <button
        type="button"
        class="shrink-0 -mr-1 p-1 rounded text-base-content/40 hover:text-base-content/70 disabled:opacity-40 disabled:hover:text-base-content/40"
        [disabled]="isDisabled()"
        [attr.aria-label]="isRevealed() ? 'Amaga la contrasenya' : 'Mostra la contrasenya'"
        [attr.aria-pressed]="isRevealed()"
        [attr.aria-controls]="inputId()"
        (click)="toggleReveal()"
        data-testid="lib-input-reveal"
      >
        <lucide-icon [img]="isRevealed() ? EyeOffIcon : EyeIcon" [size]="16" />
      </button>
    }
  </div>
</lib-form-field>
