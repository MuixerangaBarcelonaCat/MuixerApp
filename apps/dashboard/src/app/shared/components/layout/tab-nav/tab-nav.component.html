<!-- Desktop + tablet tabs -->
<div class="hidden sm:flex border-b border-base-300 bg-base-100 px-4">
  @for (tab of tabs; track tab.path) {
    <a
      [routerLink]="tab.path"
      routerLinkActive="tab-active border-b-2 border-primary text-primary font-semibold"
      class="flex items-center gap-2 px-4 py-3 text-sm text-base-content/70 hover:text-base-content transition-colors cursor-pointer whitespace-nowrap"
    >
      <lucide-icon [name]="tab.icon" [size]="16" />
      <!-- Text: visible from md up (tablet included), icon-only only below md -->
      <span class="hidden md:inline">{{ tab.label }}</span>
      <!-- Accessible label for the icon-only range (sm-md) -->
      <span class="md:hidden sr-only">{{ tab.label }}</span>
    </a>
  }
</div>

<!-- Mobile: hamburger dropdown -->
<div class="sm:hidden bg-base-100 border-b border-base-300 px-4 py-2">
  <div class="relative w-full">
    <button
      class="btn btn-ghost btn-sm w-full justify-start gap-2"
      (click)="mobileMenuToggle.emit()"
      type="button"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-haspopup="true"
    >
      <lucide-icon name="Menu" [size]="18" />
      <span class="text-sm font-medium">Navegar</span>
      <lucide-icon [name]="mobileMenuOpen() ? 'ChevronUp' : 'ChevronDown'" [size]="14" class="ml-auto" />
    </button>

    @if (mobileMenuOpen()) {
      <div
        class="fixed inset-0 z-40"
        (click)="mobileMenuToggle.emit()"
        aria-hidden="true"
      ></div>
      <ul
        class="absolute left-0 right-0 z-50 mt-1 menu bg-base-100 rounded-box shadow-lg border border-base-300"
        role="menu"
      >
        @for (tab of tabs; track tab.path) {
          <li role="none">
            <a
              [routerLink]="tab.path"
              routerLinkActive="active"
              class="flex items-center gap-3 py-3"
              (click)="mobileMenuToggle.emit()"
              role="menuitem"
            >
              <lucide-icon [name]="tab.icon" [size]="18" />
              {{ tab.label }}
            </a>
          </li>
        }
      </ul>
    }
  </div>
</div>
