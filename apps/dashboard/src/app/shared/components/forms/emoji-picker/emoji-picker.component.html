<div class="relative inline-block" #wrapper>
  <!-- Not a <lib-button>: this opens a dropdown-style panel, same as lib-select's own trigger —
       it reads as part of a field, not a discrete action, so it deliberately skips ds-lift too
       (see docs/DESIGN_SYSTEM.md's lib-select section). Reuses the same select/select-bordered
       field chrome (border weight + focus-swap come from the shared libs/ui/src/styles/_fields.scss),
       compacted to h-8 with symmetric px-2. `bg-none` drops DaisyUI's own arrow (a background-image
       meant for a real <select>) since this <button> draws its own ChevronDown below — left in
       place the two stacked into a double arrow; `px-2` replaces the padding reserved for it. -->
  <button
    type="button"
    class="select select-bordered select-sm bg-none h-8 min-h-0 px-2 gap-1 items-center justify-center"
    [disabled]="disabled()"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-haspopup="dialog"
    aria-label="Tria un emoji per a les observacions tècniques"
  >
    <span class="text-base leading-none" [class.opacity-40]="!value()">{{ value() ?? '🙂' }}</span>
    <lucide-icon name="ChevronDown" [size]="12" />
  </button>

  @if (open()) {
    <div
      class="absolute z-dropdown mt-1 bg-base-100 border border-base-300 rounded-box shadow-overlay p-2 w-[26rem]"
      role="dialog"
      aria-label="Selector d'emoji"
    >
      <emoji-picker (emoji-click)="onEmojiClick($event)" style="width: 100%; height: 520px;"></emoji-picker>
    </div>
  }
</div>
