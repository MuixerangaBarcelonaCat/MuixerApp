    <lucide-icon [img]="RefreshCw" [size]="14" class="text-info shrink-0" aria-hidden="true" />
    <span>Algú ha fet canvis en este segment. Actualitzeu per veure'ls.</span>
    <span class="ml-auto">
      <lib-button variant="info" outline size="xs" (clicked)="apply()">Actualitza</lib-button>
    </span>
  </div>
}
