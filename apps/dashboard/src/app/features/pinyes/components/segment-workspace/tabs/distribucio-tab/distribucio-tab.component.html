<div class="flex h-full min-h-0">
  <!-- Canvas -->
  <div class="relative flex-1 min-w-0">
    @if (loading()) {
      <div class="absolute inset-0 z-10 flex items-center justify-center bg-base-100/80">
        <span class="loading loading-spinner loading-lg text-primary" aria-label="S'està carregant..."></span>
      </div>
    }

    <app-figure-canvas
      #canvas
      mode="composition"
      [compositionSlots]="slots()"
      [selectedSlotId]="selectedSlotId()"
      [gridEnabled]="true"
      [gridSpacing]="gridSpacing"
      [snapToGrid]="snapToGrid"
      [cordoObertOpacity]="0.5"
      (slotSelected)="onSlotSelected($event)"
      (slotMoved)="onSlotMoved($event)"
      (troncMoved)="onTroncMoved($event)"
    />

    <button
      type="button"
      class="btn btn-sm btn-outline btn-error gap-1.5 absolute bottom-3 right-3 shadow"
      (click)="onResetDistribution()"
      aria-label="Esborra la distribució i torna al disseny automàtic"
    >
      <lucide-icon name="RotateCcw" [size]="15" aria-hidden="true" />
     Optimitza distribució
    </button>
  </div>

  <!-- Properties panel -->
  @if (propertiesEntry(); as entry) {
    <aside class="w-70 shrink-0 bg-base-100 border-l border-base-300 flex flex-col overflow-y-auto p-3 space-y-3" aria-label="Propietats de la figura">
      <app-figure-properties-panel
        [entry]="entry"
        [showRemove]="false"
        (labelChanged)="onLabelChanged($event)"
        (figureModeChanged)="onFigureModeChanged($event)"
        (numberOfCordonsChanged)="onNumberOfCordonsChanged($event)"
        (offsetXChanged)="onOffsetXChanged($event)"
        (offsetYChanged)="onOffsetYChanged($event)"
        (angleChanged)="onAngleChanged($event)"
      />
    </aside>
  }
</div>
