<div class="flex flex-col h-full min-h-0">
<div class="flex flex-1 min-h-0">
  <!-- Canvas -->
  <div class="relative flex-1 min-w-0">
    @if (ws.pinyaSlots().length === 0) {
      <div class="absolute inset-0 z-10 flex items-center justify-center text-base-content/50">
        Este segment no té cap figura amb pinya.
      </div>
    }

    <!-- Undo/redo -->
    <div class="absolute top-2 right-2 z-10 flex items-center gap-1 bg-base-100/90 backdrop-blur rounded-lg shadow-raised border border-base-300 p-1">
      <lib-button
        variant="ghost"
        size="xs"
        shape="square"
        [disabled]="!canUndo() || ws.isLocked()"
        [ariaLabel]="undoDescription() ? 'Desfer: ' + undoDescription() : 'Desfer'"
        [title]="undoDescription() ? 'Desfer: ' + undoDescription() : 'Desfer (Ctrl+Z)'"
        (clicked)="performUndo()"
      >
        <lucide-icon [img]="Undo2" [size]="14" aria-hidden="true" />
      </lib-button>
      <lib-button
        variant="ghost"
        size="xs"
        shape="square"
        [disabled]="!canRedo() || ws.isLocked()"
        [ariaLabel]="redoDescription() ? 'Refer: ' + redoDescription() : 'Refer'"
        [title]="redoDescription() ? 'Refer: ' + redoDescription() : 'Refer (Ctrl+Shift+Z)'"
        (clicked)="performRedo()"
      >
        <lucide-icon [img]="Redo2" [size]="14" aria-hidden="true" />
      </lib-button>
    </div>

    <!-- Moving a person: says who, offers a cross to cancel -->
    @if (movingAlias(); as alias) {
      <div class="absolute top-2 left-2 right-24 z-10 flex justify-center pointer-events-none">
        <app-move-banner class="block max-w-full pointer-events-auto" [alias]="alias" (cancelled)="cancelMove()" />
      </div>
    }

    <app-figure-canvas
      #canvas
      mode="segment-assignment"
      [compositionSlots]="ws.pinyaSlots()"
      [assignments]="state.assignments()"
      [conflictPersonIds]="ws.conflictPersonIds()"
      [selectedSegmentNode]="selectedRef()"
      [heightMode]="state.heightMode()"
      [attendanceMap]="attendanceMap()"
      [nextPerformanceMap]="nextPerformanceMap()"
      [personDetailsMap]="personDetailsMap()"
      [highlightedNodeIds]="highlightedNodeIds()"
      [isPast]="isPast()"
      [personDragEnabled]="!isTouch()"
      (segmentNodeSelected)="onSegmentNodeSelected($event)"
      (segmentNodeContextMenu)="onNodeContextMenu($event)"
      (segmentNodeDropped)="onNodeDropped($event.source, $event.target)"
    />
  </div>

  <!-- Person panel: a side column on desktop; on touch it lives in a modal opened by tapping a node -->
  <ng-template #personPanelTpl>
  <app-person-panel
    [class]="isTouch() ? 'block h-full min-h-0' : 'w-80 shrink-0 border-l border-base-300 h-full min-h-0'"
    area="PINYA"
    [searchOnly]="isTouch()"
    [eventId]="ws.eventId()"
    [segmentId]="ws.segmentId()"
    [selectedNodeId]="state.selectedNodeId()"
    [assignments]="state.assignments()"
    [heightMode]="state.heightMode()"
    [activeNodePositionType]="selectedNodePositionType()"
    [selectedNodeZone]="selectedNodeZone()"
    [isPast]="isPast()"
    (personSelected)="onPersonSelected($event)"
    (assignedPersonSelected)="onAssignedPersonSelected($event)"
    (unassignRequested)="onUnassign($event)"
    (navigateNode)="navigateAdjacent($event)"
  />
  </ng-template>

  @if (isTouch()) {
    <lib-modal
      size="sm"
      [open]="personPickerOpen()"
      [title]="personPickerTitle()"
      (closed)="onPersonPickerClosed()"
    >
      <div class="h-80">
        <ng-container [ngTemplateOutlet]="personPanelTpl" />
      </div>
    </lib-modal>
  } @else {
    <ng-container [ngTemplateOutlet]="personPanelTpl" />
  }
</div>
</div>

@if (reassignDialog(); as dialog) {
  <app-already-assigned-dialog
    [open]="true"
    [personAlias]="dialog.personAlias"
    [nodeLabel]="dialog.oldNodeLabel"
    [figureName]="dialog.figureName"
    [placements]="dialog.placements"
    (closed)="onReassignDialogClosed()"
    (viewRequested)="onReassignDialogView()"
    (reassignRequested)="onReassignDialogConfirm()"
    (assignAnywayRequested)="onReassignDialogAssignAnyway()"
  />
}
