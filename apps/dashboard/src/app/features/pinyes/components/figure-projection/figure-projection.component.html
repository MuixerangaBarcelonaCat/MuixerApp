@if (loading()) {
  <div class="flex h-screen w-screen items-center justify-center bg-black" role="status" aria-live="polite">
    <span class="loading loading-spinner loading-lg text-white"></span>
    <span class="sr-only">Carregant figura...</span>
  </div>
} @else if (activeInstance()) {
  <div
    class="relative h-screen w-screen bg-white text-gray-900"
    role="main"
    aria-label="Vista de figura en projecció"
  >

    @if (isNetaFigure()) {
      <!-- ── Figura neta: TroncView centered as main content ──────────── -->
      <main class="h-full w-full flex items-center justify-center overflow-hidden p-8">
        <div class="tronc-centered-main">
          <app-tronc-view
            mode="projection"
            [troncNodes]="troncNodes()"
            [baseNodes]="baseNodes()"
            [directionNodes]="directionNodes()"
            [isNetaFigure]="true"
            [assignments]="assignmentList()"
          />
        </div>
      </main>
    } @else {
      <!-- ── Figura completa: Konva canvas + floating tronc ────────────── -->
      <main class="h-full w-full overflow-hidden">
        <app-figure-canvas
          class="block w-full h-full"
          mode="readonly"
          [gridEnabled]="false"
          [nodes]="pinyaNodes()"
          [assignments]="assignmentList()"
        />
      </main>

      @if (!troncPanelOpen()) {
        <button
          type="button"
          class="fixed top-4 right-4 z-40 btn btn-ghost btn-sm gap-1 text-gray-600 hover:text-gray-900 focus-visible:opacity-100"
          (click)="troncPanelOpen.set(true)"
          aria-label="Obrir panell del Tronc"
        >
          <lucide-icon name="PanelLeft" [size]="16" aria-hidden="true" />
          Tronc
        </button>
      }

      @if (troncPanelOpen()) {
        <aside
          class="tronc-floating-panel"
          [style.left.px]="troncPanelPos().x"
          [style.top.px]="troncPanelPos().y"
          aria-label="Tronc de la figura"
          tabindex="-1"
          (keydown.escape)="troncPanelOpen.set(false)"
        >
          <div
            class="tronc-floating-header"
            (mousedown)="onTroncDragStart($event)"
          >
            <lucide-icon name="GripVertical" [size]="14" class="drag-handle" aria-hidden="true" />
            <h3 class="tronc-floating-title">Tronc</h3>
            <button
              type="button"
              class="btn btn-ghost btn-xs btn-square"
              (click)="troncPanelOpen.set(false)"
              aria-label="Tancar panell del Tronc"
            >
              <lucide-icon name="X" [size]="14" aria-hidden="true" />
            </button>
          </div>
          <div class="tronc-floating-body">
            <app-tronc-view
              mode="projection"
              [troncNodes]="troncNodes()"
              [baseNodes]="baseNodes()"
              [directionNodes]="directionNodes()"
              [isNetaFigure]="false"
              [assignments]="assignmentList()"
            />
          </div>
        </aside>
      }
    }

    <!-- Navigation buttons (top-left) -->
    <nav class="fixed top-4 left-4 z-40 flex flex-col gap-1" aria-label="Navegació">
      <button
        type="button"
        class="btn btn-ghost btn-sm gap-1 text-gray-600 hover:text-gray-900 focus-visible:opacity-100"
        (click)="navigateToAssignment()"
        aria-label="Tornar a l'assignació"
      >
        <lucide-icon name="ArrowLeft" [size]="16" aria-hidden="true" />
        Tornar a l'assignació
      </button>
      @if (standaloneMode()) {
        <button
          type="button"
          class="btn btn-ghost btn-sm gap-1 text-gray-400 hover:text-gray-700 focus-visible:opacity-100"
          (click)="navigateToProjection()"
          aria-label="Projecció del segment"
        >
          <lucide-icon name="LayoutGrid" [size]="16" aria-hidden="true" />
          Projecció del segment
        </button>
      }
    </nav>

    <!-- Figure name (bottom-center) -->
    <span
      class="fixed bottom-4 left-1/2 -translate-x-1/2 text-lg font-semibold text-gray-700 opacity-70 pointer-events-none truncate max-w-[60%]"
      aria-live="polite"
    >
      {{ displayName() }}
    </span>

  </div>
} @else {
  <div class="flex h-screen w-screen items-center justify-center bg-base-200" role="status">
    <p class="text-base-content/60">Figura no trobada.</p>
  </div>
}
