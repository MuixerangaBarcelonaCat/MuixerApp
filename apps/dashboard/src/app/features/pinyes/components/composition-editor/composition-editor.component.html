<div class="flex flex-col h-screen bg-base-200 overflow-hidden">

  <!-- Top bar -->
  <header class="editor-topbar" role="banner">
    <div class="flex items-center gap-3 min-w-0">
      <lib-button variant="ghost" size="sm" shape="square" ariaLabel="Torna enrere" (clicked)="goBack()">
        <lucide-icon name="ArrowLeft" [size]="16" aria-hidden="true" />
      </lib-button>

      <!-- Composition name, with an inline rename affordance -->
      <div class="flex items-center gap-2 min-w-0">
        @if (renamingName()) {
          <div class="w-56" data-testid="composition-name-input">
            <lib-input
              size="sm"
              ariaLabel="Nom de la composició"
              [autofocus]="true"
              [ngModel]="nameDraft()"
              (ngModelChange)="nameDraft.set($event)"
              (keydown.enter)="confirmRename()"
              (keydown.escape)="cancelRename()"
            />
          </div>
          <lib-button variant="ghost" size="sm" shape="square" ariaLabel="Accepta el nom" (clicked)="confirmRename()">
            <lucide-icon name="Check" [size]="16" aria-hidden="true" />
          </lib-button>
          <lib-button variant="ghost" size="sm" shape="square" ariaLabel="Cancel·la el canvi de nom" (clicked)="cancelRename()">
            <lucide-icon name="X" [size]="16" aria-hidden="true" />
          </lib-button>
        } @else {
          <span class="text-lg font-semibold font-serif leading-tight text-base-content truncate max-w-64">{{ name() }}</span>
          <lib-button variant="ghost" size="sm" shape="square" ariaLabel="Renombra la composició" (clicked)="startRename()">
            <lucide-icon name="Pencil" [size]="14" aria-hidden="true" />
          </lib-button>
        }
      </div>
    </div>

    <div class="flex items-center gap-3">
      <!-- Save status -->
      @if (saveStatus() !== 'idle') {
        <span class="text-xs" [class]="saveStatusClass" aria-live="polite">
          {{ saveStatusLabel }}
        </span>
      }

      <!-- Snap toggle -->
      <lib-button
        [variant]="snapToGrid ? 'primary' : 'ghost'"
        [outline]="snapToGrid ? true : false"
        size="sm"
        [ariaPressed]="snapToGrid"
        ariaLabel="Alterna l'ajust a la graella"
        (clicked)="toggleSnap()"
      >
        <lucide-icon name="Magnet" [size]="15" aria-hidden="true" />
        Ajusta
      </lib-button>
    </div>
  </header>

  <div class="flex-1 flex flex-col sm:flex-row min-h-0 overflow-hidden">

    <!-- Left panel: figure template picker -->
    <aside class="w-full max-h-[45vh] sm:max-h-none sm:w-[280px] shrink-0 bg-base-100 border-b sm:border-b-0 sm:border-r border-base-200 flex flex-col overflow-hidden" aria-label="Figures disponibles">
      <div class="p-3 border-b border-base-200">
        <lib-input
          type="search"
          size="sm"
          [icon]="SearchIcon"
          placeholder="Cerca..."
          ariaLabel="Cerca figures"
          [ngModel]="search()"
          (ngModelChange)="search.set($event)"
        />
      </div>

      <ul class="flex-1 overflow-y-auto space-y-0.5 p-2" role="list">
        @for (t of filteredTemplates(); track t.id) {
          <li>
            <button
              type="button"
              class="w-full flex items-center justify-between px-2 py-1.5 rounded-lg hover:bg-base-200 transition-colors text-left"
              (click)="addFigureTemplate(t)"
              [attr.aria-label]="'Afegeix ' + t.name"
            >
              <span class="font-medium text-sm truncate">{{ t.name }}</span>
              @if (!t.hasPinya) {
                <span class="badge badge-xs badge-info shrink-0">Neta</span>
              }
            </button>
          </li>
        } @empty {
          <li class="text-center text-sm text-base-content/40 py-8">Cap figura trobada</li>
        }
      </ul>
    </aside>

    <!-- Center: canvas -->
    <main class="flex-1 min-h-0 relative overflow-hidden" aria-label="Llenç de la composició">
      @if (loading()) {
        <div class="absolute inset-0 flex items-center justify-center bg-base-200/50 z-20">
          <span class="loading loading-spinner loading-lg text-primary" aria-label="S'està carregant..."></span>
        </div>
      }

      @if (!loading()) {
        <app-figure-canvas
          #canvas
          mode="composition"
          [compositionSlots]="compositionSlots()"
          [selectedSlotId]="selectedEntryId()"
          [gridEnabled]="true"
          [gridSpacing]="gridSpacing"
          [snapToGrid]="snapToGrid"
          (slotSelected)="onSlotSelected($event)"
          (slotMoved)="onSlotMoved($event)"
          (troncMoved)="onTroncMoved($event)"
        />
      }
    </main>

    <!-- Right panel: entry properties -->
    @if (propertiesEntry(); as entry) {
      <aside class="w-full max-h-[45vh] sm:max-h-none sm:w-[280px] shrink-0 bg-base-100 border-t sm:border-t-0 sm:border-l border-base-200 flex flex-col overflow-y-auto p-3 space-y-3" aria-label="Propietats de la figura">
        <app-figure-properties-panel
          [entry]="entry"
          (labelChanged)="updateLabel($event.id, $event.value ?? '')"
          (figureModeChanged)="updateFigureMode($event.id, $event.value)"
          (numberOfCordonsChanged)="updateNumberOfCordons($event.id, $event.value)"
          (cordonsObertsEnabledChanged)="updateCordonsObertsEnabled($event.id, $event.value)"
          (offsetXChanged)="updateOffsetX($event.id, $event.value)"
          (offsetYChanged)="updateOffsetY($event.id, $event.value)"
          (angleChanged)="updateAngle($event.id, $event.value)"
          (removeRequested)="removeEntry($event)"
        />
      </aside>
    }

  </div>

</div>
