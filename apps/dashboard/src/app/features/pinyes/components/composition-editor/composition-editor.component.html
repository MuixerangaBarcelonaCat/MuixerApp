<div class="flex flex-col h-screen bg-base-200 overflow-hidden">

  <!-- Top bar -->
  <header class="flex items-center gap-3 px-4 h-14 bg-base-100 border-b border-base-200 shrink-0 z-10">
    <button
      type="button"
      class="btn btn-ghost btn-sm gap-2"
      (click)="goBack()"
      aria-label="Torna enrere"
    >
      <lucide-icon name="ArrowLeft" [size]="16" aria-hidden="true" />
      Torna
    </button>

    <div class="divider divider-horizontal m-0 h-6"></div>

    <input
      type="text"
      class="input input-bordered input-sm w-56 font-semibold"
      placeholder="Nom de la composició"
      [ngModel]="name()"
      (ngModelChange)="updateName($event)"
      aria-label="Nom de la composició"
    />

    <div class="flex-1"></div>

    <!-- Save status -->
    <span class="text-xs" [class]="saveStatusClass" aria-live="polite">
      {{ saveStatusLabel }}
    </span>

    <!-- Snap toggle -->
    <button
      type="button"
      class="btn btn-ghost btn-sm gap-1.5"
      [class.btn-active]="snapToGrid"
      (click)="toggleSnap()"
      aria-pressed="{{ snapToGrid }}"
      aria-label="Alterna l'ajust a la graella"
    >
      <lucide-icon name="Magnet" [size]="15" aria-hidden="true" />
      Ajusta
    </button>
  </header>

  <div class="flex-1 flex overflow-hidden">

    <!-- Left panel: figure template picker -->
    <aside class="w-70 shrink-0 bg-base-100 border-r border-base-200 flex flex-col overflow-hidden" aria-label="Figures disponibles">
      <div class="p-3 border-b border-base-200">
        <label class="input input-sm input-bordered flex items-center gap-2">
          <lucide-icon name="Search" [size]="14" class="text-base-content/40" aria-hidden="true" />
          <input
            type="search"
            class="grow bg-transparent outline-none text-sm"
            placeholder="Cerca..."
            [ngModel]="search()"
            (ngModelChange)="search.set($event)"
            aria-label="Cerca figures"
          />
        </label>
      </div>

      <ul class="flex-1 overflow-y-auto space-y-0.5 p-2" role="list">
        @for (t of filteredTemplates(); track t.id) {
          <li>
            <button
              type="button"
              class="w-full flex items-center justify-between px-2 py-1.5 rounded-lg hover:bg-base-200 transition-colors text-left"
              (click)="addFigureTemplate(t)"
              [attr.aria-label]="'Afegeix ' + t.name"
            >
              <span class="font-medium text-sm truncate">{{ t.name }}</span>
              @if (!t.hasPinya) {
                <span class="badge badge-xs badge-info shrink-0">Tronc</span>
              }
            </button>
          </li>
        } @empty {
          <li class="text-center text-sm text-base-content/40 py-8">Cap figura trobada</li>
        }
      </ul>
    </aside>

    <!-- Center: canvas -->
    <main class="flex-1 relative overflow-hidden" aria-label="Llenç de la composició">
      @if (loading()) {
        <div class="absolute inset-0 flex items-center justify-center bg-base-200/50 z-20">
          <span class="loading loading-spinner loading-lg text-primary" aria-label="S'està carregant..."></span>
        </div>
      }

      @if (!loading()) {
        <app-figure-canvas
          #canvas
          mode="composition"
          [compositionSlots]="compositionSlots()"
          [selectedSlotId]="selectedEntryId()"
          [gridEnabled]="true"
          [gridSpacing]="gridSpacing"
          [snapToGrid]="snapToGrid"
          (slotSelected)="onSlotSelected($event)"
          (slotMoved)="onSlotMoved($event)"
          (troncMoved)="onTroncMoved($event)"
        />
      }
    </main>

    <!-- Right panel: entry properties -->
    @if (selectedEntry(); as entry) {
      <aside class="w-70 shrink-0 bg-base-100 border-l border-base-200 flex flex-col overflow-y-auto p-3 space-y-3" aria-label="Propietats de la figura">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-semibold">Propietats</h3>
        </div>

        <div class="form-control">
          <label class="label pb-1" [for]="'entry-label-' + entry.id">
            <span class="label-text text-xs font-medium">Nom</span>
          </label>
          <input
            type="text"
            [id]="'entry-label-' + entry.id"
            class="input input-bordered input-sm"
            [placeholder]="entry.figureTemplate.name"
            [ngModel]="entry.label"
            (ngModelChange)="updateLabel(entry.id, $event)"
          />
        </div>

        <div class="form-control">
          <label class="label pb-1" [for]="'entry-mode-' + entry.id">
            <span class="label-text text-xs font-medium">Mode</span>
          </label>
          <select
            [id]="'entry-mode-' + entry.id"
            class="select select-bordered select-sm"
            [ngModel]="entry.figureMode"
            (ngModelChange)="updateFigureMode(entry.id, $event)"
          >
            <option value="COMPLETA">Completa</option>
            <option value="PEU">Peu</option>
            <option value="REMAT">Remat</option>
            <option value="NETA">Neta</option>
          </select>
        </div>

        @if (entry.figureMode === 'COMPLETA' || entry.figureMode === 'PEU') {
          <div class="form-control">
            <label class="label pb-1" [for]="'entry-cordons-' + entry.id">
              <span class="label-text text-xs font-medium">Cordons</span>
            </label>
            <input
              type="number"
              [id]="'entry-cordons-' + entry.id"
              class="input input-bordered input-sm font-mono"
              placeholder="Tots"
              min="1"
              [ngModel]="entry.numberOfCordons"
              (ngModelChange)="updateNumberOfCordons(entry.id, $event === '' ? null : +$event)"
            />
          </div>
        }

        <div>
          <p class="label-text text-xs font-medium mb-1">Posició</p>
          <div class="grid grid-cols-2 gap-2">
            <div class="form-control">
              <label class="label pb-0.5" [for]="'entry-x-' + entry.id">
                <span class="label-text text-xs">X</span>
              </label>
              <input
                type="number"
                [id]="'entry-x-' + entry.id"
                class="input input-bordered input-sm font-mono"
                [ngModel]="entry.offsetX"
                (ngModelChange)="updateOffsetX(entry.id, +$event)"
              />
            </div>
            <div class="form-control">
              <label class="label pb-0.5" [for]="'entry-y-' + entry.id">
                <span class="label-text text-xs">Y</span>
              </label>
              <input
                type="number"
                [id]="'entry-y-' + entry.id"
                class="input input-bordered input-sm font-mono"
                [ngModel]="entry.offsetY"
                (ngModelChange)="updateOffsetY(entry.id, +$event)"
              />
            </div>
          </div>
        </div>

        <div class="form-control">
          <label class="label pb-1" [for]="'entry-angle-' + entry.id">
            <span class="label-text text-xs font-medium">Angle</span>
          </label>
          <input
            type="number"
            [id]="'entry-angle-' + entry.id"
            class="input input-bordered input-sm font-mono"
            [ngModel]="entry.angle"
            (ngModelChange)="updateAngle(entry.id, +$event)"
          />
        </div>

        <button
          type="button"
          class="btn btn-error btn-outline btn-sm gap-1.5 mt-2"
          (click)="removeEntry(entry.id)"
          [attr.aria-label]="'Elimina ' + (entry.label ?? entry.figureTemplate.name)"
        >
          <lucide-icon name="Trash2" [size]="14" aria-hidden="true" />
          Elimina
        </button>
      </aside>
    }

  </div>

</div>
