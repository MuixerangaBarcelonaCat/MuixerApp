<lib-modal [open]="true" [title]="isEditMode ? 'Edita temporada' : 'Temporada nova'" (closed)="onCancel()">
  @if (errorMessage()) {
    <div class="alert alert-error shadow-raised mb-4" role="alert">
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSave()" class="flex flex-col gap-4" novalidate>

    <lib-input
      label="Nom"
      required
      formControlName="name"
      placeholder="Ex: Temporada 2025-2026"
      [errorText]="fieldError('name') ?? undefined"
    />

    <div class="grid grid-cols-2 gap-4">
      <lib-input
        label="Data inici"
        required
        type="date"
        formControlName="startDate"
        [errorText]="fieldError('startDate') ?? undefined"
      />

      <lib-input
        label="Data fi"
        required
        type="date"
        formControlName="endDate"
        [errorText]="fieldError('endDate') ?? (dateRangeInvalid ? 'La data fi ha de ser posterior a la data d\'inici' : undefined)"
      />
    </div>

    <div class="form-control">
      <label class="label pb-1" for="season-description">
        <span class="label-text text-xs font-medium">Descripció</span>
      </label>
      <textarea
        id="season-description"
        class="textarea textarea-bordered w-full"
        formControlName="description"
        rows="3"
        maxlength="500"
        placeholder="Descripció opcional de la temporada"
      ></textarea>
      @if (fieldError('description')) {
        <div class="label pt-0.5"><span class="label-text-alt text-error">{{ fieldError('description') }}</span></div>
      }
    </div>

  </form>

  <div modalFooter>
    <lib-button variant="ghost" size="sm" (clicked)="onCancel()">
      Cancel·la
    </lib-button>
    <lib-button
      variant="primary"
      size="sm"
      [disabled]="form.invalid || saving() || dateRangeInvalid"
      [loading]="saving()"
      (clicked)="onSave()"
    >
      {{ isEditMode ? 'Alça' : 'Crea' }}
    </lib-button>
  </div>
</lib-modal>
