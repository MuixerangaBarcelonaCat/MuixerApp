<lib-modal [open]="true" [title]="isEditMode ? 'Edita temporada' : 'Temporada nova'" (closed)="onCancel()">
  @if (errorMessage()) {
    <div class="alert alert-error shadow-raised mb-4" role="alert">
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSave()" class="flex flex-col gap-4" novalidate>

    <lib-input
      label="Nom"
      required
      formControlName="name"
      placeholder="Ex: Temporada 2025-2026"
      [errorText]="fieldError('name') ?? undefined"
    />

    <div class="grid grid-cols-2 gap-4">
      <lib-input
        label="Data inici"
        required
        type="date"
        formControlName="startDate"
        [errorText]="fieldError('startDate') ?? undefined"
      />

      <lib-input
        label="Data fi"
        required
        type="date"
        formControlName="endDate"
        [errorText]="fieldError('endDate') ?? (dateRangeInvalid ? 'La data fi ha de ser posterior a la data d\'inici' : undefined)"
      />
    </div>

    <lib-textarea
      label="Descripció"
      formControlName="description"
      [rows]="3"
      [maxLength]="500"
      placeholder="Descripció opcional de la temporada"
      [errorText]="fieldError('description') ?? undefined"
    />

  </form>

  <div modalFooter>
    <lib-button variant="ghost" size="sm" (clicked)="onCancel()">
      Cancel·la
    </lib-button>
    <lib-button
      variant="primary"
      size="sm"
      [disabled]="form.invalid || saving() || dateRangeInvalid"
      [loading]="saving()"
      (clicked)="onSave()"
    >
      {{ isEditMode ? 'Alça' : 'Crea' }}
    </lib-button>
  </div>
</lib-modal>
