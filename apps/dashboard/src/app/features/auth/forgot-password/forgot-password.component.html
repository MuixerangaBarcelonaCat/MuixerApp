<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card bg-base-100 shadow-lg w-full max-w-sm">
    <div class="card-body gap-5">

      <div class="text-center">
        <h1 class="text-2xl font-bold text-base-content">Recuperació de contrasenya</h1>
        <p class="text-sm text-base-content/50 mt-1">Introduïu el correu electrònic del compte</p>
      </div>

      @if (submitted()) {
        <div class="alert alert-success text-sm py-2">
          <lucide-icon name="CheckCircle" [size]="16" />
          <span>Si l'adreça existeix, rebreu un correu amb instruccions per a recuperar la contrasenya.</span>
        </div>
      } @else {
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

          <label class="form-control w-full">
            <div class="label pb-1"><span class="label-text font-medium">Correu electrònic</span></div>
            <div class="input input-bordered flex items-center gap-2" [class.input-error]="form.get('email')?.invalid && form.get('email')?.touched">
              <lucide-icon name="Mail" [size]="16" class="text-base-content/40 shrink-0" />
              <input
                type="email"
                class="grow bg-transparent outline-none text-sm h-6"
                placeholder="nom@exemple.com"
                formControlName="email"
                autocomplete="email"
              />
            </div>
            @if (form.get('email')?.invalid && form.get('email')?.touched) {
              <div class="label pt-1">
                <span class="label-text-alt text-error" role="alert">Correu electrònic no vàlid</span>
              </div>
            }
          </label>

          @if (errorMessage()) {
            <div class="alert alert-error text-sm py-2">
              <lucide-icon name="AlertCircle" [size]="16" />
              <span>{{ errorMessage() }}</span>
            </div>
          }

          <button
            type="submit"
            class="btn btn-primary w-full"
            [disabled]="form.invalid || isLoading()"
          >
            @if (isLoading()) {
              <span class="loading loading-spinner loading-sm"></span>
              S'està enviant...
            } @else {
              Envia l'enllaç de recuperació
            }
          </button>
        </form>
      }

      <a routerLink="/login" class="link link-hover text-sm text-center text-base-content/60">
        Torna a l'inici de sessió
      </a>

    </div>
  </div>
</div>
