<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card bg-base-100 shadow-modal w-full max-w-sm">
    <div class="card-body gap-5">

      <!-- Logo + títol -->
      <div class="text-center">
        <img
          src="/assets/logoMuixe.svg"
          alt="Logo MuixerApp"
          class="h-14 w-14 mx-auto mb-3 object-contain"
          onerror="this.style.display='none'"
        />
        <h1 class="text-2xl font-bold font-serif text-base-content">MuixerApp</h1>
        <p class="text-sm text-base-content/50 mt-1">Inicieu sessió per continuar</p>
      </div>

      <!-- Formulari -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

        <lib-input
          label="Correu electrònic"
          type="email"
          size="md"
          [icon]="MailIcon"
          placeholder="nom@exemple.com"
          formControlName="email"
          autocomplete="email"
          [errorText]="form.get('email')?.invalid && form.get('email')?.touched ? 'Correu electrònic no vàlid' : undefined"
        />

        <div>
          <label for="password" class="flex items-center justify-between mb-1">
            <span class="label-text font-medium">Contrasenya</span>
            <a routerLink="/forgot-password" class="label-text-alt link link-hover" tabindex="-1">He oblidat la contrasenya?</a>
      
          </label>
          <lib-input
            id="password"
            type="password"
            size="md"
            [icon]="LockIcon"
            placeholder="••••••••"
            formControlName="password"
            autocomplete="current-password"
          />
        </div>

        <!-- Error general -->
        @if (errorMessage()) {
          <div class="alert alert-error text-sm py-2">
            <lucide-icon name="AlertCircle" [size]="16" />
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <lib-button type="submit" variant="primary" fullWidth [disabled]="form.invalid" [loading]="isLoading()">
          @if (isLoading()) {
            Iniciant sessió...
          } @else {
            Inicia sessió
          }
        </lib-button>

      </form>
    </div>
  </div>
</div>
