<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card bg-base-100 shadow-lg w-full max-w-sm">
    <div class="card-body gap-5">

      <div class="text-center">
        <h1 class="text-2xl font-bold text-base-content">Contrasenya nova</h1>
        <p class="text-sm text-base-content/50 mt-1">Trieu una contrasenya nova per al compte</p>
      </div>

      @if (missingToken()) {
        <div class="alert alert-error text-sm py-2">
          <lucide-icon name="AlertCircle" [size]="16" />
          <span>L'enllaç de recuperació no és vàlid.</span>
        </div>
        <a routerLink="/forgot-password" class="link link-hover text-sm text-center text-base-content/60">
          Torna a sol·licitar la recuperació
        </a>
      } @else {
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

          <label class="form-control w-full">
            <div class="label pb-1"><span class="label-text font-medium">Contrasenya nova</span></div>
            <div class="input input-bordered flex items-center gap-2" [class.input-error]="form.get('password')?.invalid && form.get('password')?.touched">
              <lucide-icon name="Lock" [size]="16" class="text-base-content/40 shrink-0" />
              <input
                type="password"
                class="grow bg-transparent outline-none text-sm h-6"
                placeholder="••••••••"
                formControlName="password"
                autocomplete="new-password"
              />
            </div>
            @if (form.get('password')?.hasError('minlength') && form.get('password')?.touched) {
              <div class="label pt-1">
                <span class="label-text-alt text-error" role="alert">La contrasenya ha de tindre almenys 8 caràcters</span>
              </div>
            }
          </label>

          <label class="form-control w-full">
            <div class="label pb-1"><span class="label-text font-medium">Confirmeu la contrasenya</span></div>
            <div class="input input-bordered flex items-center gap-2" [class.input-error]="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched">
              <lucide-icon name="Lock" [size]="16" class="text-base-content/40 shrink-0" />
              <input
                type="password"
                class="grow bg-transparent outline-none text-sm h-6"
                placeholder="••••••••"
                formControlName="confirmPassword"
                autocomplete="new-password"
              />
            </div>
            @if (form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched) {
              <div class="label pt-1">
                <span class="label-text-alt text-error" role="alert">Les contrasenyes no coincideixen</span>
              </div>
            }
          </label>

          @if (errorMessage()) {
            <div class="alert alert-error text-sm py-2">
              <lucide-icon name="AlertCircle" [size]="16" />
              <span>{{ errorMessage() }}</span>
            </div>
          }

          <button
            type="submit"
            class="btn btn-primary w-full"
            [disabled]="form.invalid || isLoading()"
          >
            @if (isLoading()) {
              <span class="loading loading-spinner loading-sm"></span>
              S'està desant...
            } @else {
              Estableix la contrasenya
            }
          </button>
        </form>
      }

      <a routerLink="/login" class="link link-hover text-sm text-center text-base-content/60">
        Torna a l'inici de sessió
      </a>

    </div>
  </div>
</div>
