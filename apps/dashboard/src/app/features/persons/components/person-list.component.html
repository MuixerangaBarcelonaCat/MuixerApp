<div class="flex flex-col gap-4">

  <!-- Capçalera -->
  <app-page-header title="Persones" [count]="totalPersons()">
    <lib-button variant="primary" size="sm" (clicked)="openNewPersonModal()">
      <lucide-icon name="Plus" [size]="14" />
      Persona nova
    </lib-button>
    <lib-button variant="warning" outline size="sm" (clicked)="onSyncClick()">
      <lucide-icon name="RefreshCw" [size]="14" />
      Sincronitza
    </lib-button>
  </app-page-header>


  <!-- Filtres -->
  <app-filter-bar [hasActiveFilters]="hasFilterChips()" (clearFilters)="clearFilters()">

    <!-- Cerca -->
    <div class="w-full sm:w-64">
      <lib-input
        label="Cerca"
        placeholder="Àlies, nom..."
        [icon]="SearchIcon"
        [(ngModel)]="searchInput"
        (ngModelChange)="onSearchChange($event)"
      />
    </div>

    <!-- Etiquetes -->
    @if (positions().length > 0) {
      <div class="w-full sm:w-48">
        <lib-select
          [multiple]="true"
          label="Etiquetes"
          [ngModel]="selectedPositions()"
          (ngModelChange)="onPositionsChange($event)"
        >
          @for (position of positions(); track position.id) {
            <option [value]="position.id">{{ position.name }}</option>
          }
        </lib-select>
      </div>
    }

    <!-- Actius -->
    <div class="w-fit">
      <lib-form-field label="Estat">
        <div class="flex items-center gap-2">
          <label class="flex items-center gap-2 cursor-pointer min-h-6">
            <input
              type="checkbox"
              class="checkbox checkbox-xs checkbox-primary"
              [checked]="activeFilters().isActive === true"
              (change)="toggleActiusFilter()"
            />
            <span class="text-sm">Sols actius</span>
          </label>
          <lib-button-group>
            <lib-button
              joinItem
              outlineMode
              variant="primary"
              size="sm"
              [active]="provisionalTab() === 'cens'"
              (clicked)="setProvisionalTab('cens')"
            >
              Cens
            </lib-button>
            <lib-button
              joinItem
              outlineMode
              variant="primary"
              size="sm"
              [active]="provisionalTab() === 'provisionals'"
              (clicked)="setProvisionalTab('provisionals')"
            >
              Provisionals
            </lib-button>
          </lib-button-group>
        </div>
      </lib-form-field>
    </div>

  </app-filter-bar>

  <!-- Filtres actius + toggle columnes -->
  <div class="flex flex-wrap items-start justify-between gap-3">
    <app-active-filters
      [filters]="activeFilterChips()"
      (removeFilter)="onRemoveFilterChip($event)"
    />
    <app-column-toggle
      [columns]="allColumns"
      [visibleKeys]="visibleColumnKeys()"
      (toggleColumn)="toggleColumn($event)"
    />
  </div>

  <!-- Taula -->
  <app-data-table
    [items]="persons()"
    [columns]="tableColumns()"
    [visibleColumns]="visibleColumnKeys()"
    [sortBy]="sortBy()"
    [sortOrder]="sortOrder()"
    [loading]="loading()"
    [rowActions]="tableRowActions"
    (rowClick)="onPersonClick($any($event).id)"
    (sortChange)="onSortChangeFromTable($event)"
  />

  <!-- Estat buit -->
  @if (!loading() && persons().length === 0) {
    <lib-empty-state
      [icon]="ICON_PERSONA"
      message="No s'han trobat persones amb els filtres actuals"
      actionLabel="Netejar filtres"
      (clicked)="clearFilters()"
    />
  }

  <!-- Paginació -->
  @if (totalPersons() > 0) {
    <app-pagination
      [page]="page()"
      [totalPages]="totalPages()"
      [limit]="limit()"
      [totalItems]="totalPersons()"
      (pageChange)="goToPage($event)"
      (limitChange)="onLimitChange($event)"
    />
  }

  @if (newPersonModalOpen()) {
    <app-person-new-modal
      (closed)="newPersonModalOpen.set(false)"
      (created)="onPersonCreated($event)"
    />
  }

  <app-tutorial-modal
    #activationTutorial
    heading="Doneu accés a la persona"
    [steps]="activationTutorialSteps"
    (closed)="onActivationTutorialClosed()"
  />

</div>
