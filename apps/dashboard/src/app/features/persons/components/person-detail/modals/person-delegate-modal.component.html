<lib-modal
  [open]="true"
  [title]="isPrimary() ? 'Vincula un delegat' : 'Afegeix un altre delegat'"
  (closed)="close()"
>
  @if (error()) {
    <div class="alert alert-error text-sm mb-4" role="alert">
      <span>{{ error() }}</span>
    </div>
  }

  <!-- Type selector -->
  <div class="mb-4">
    <lib-select
      id="delegate-type"
      label="Relació"
      [ngModel]="selectedType()"
      (ngModelChange)="onTypeChange($event)"
      [disabled]="saving()"
    >
      @for (t of delegateTypes(); track t.value) {
        <option [value]="t.value">{{ t.label }}</option>
      }
    </lib-select>
  </div>

  <!-- User search -->
  <lib-input
    id="delegate-user-search"
    label="Cerca usuari"
    [ngModel]="searchTerm()"
    (ngModelChange)="onSearch($event)"
    placeholder="Correu o nom..."
    [disabled]="saving()"
  />

  <!-- User list -->
  <div class="max-h-48 overflow-y-auto border border-base-300 rounded-box mb-4 mt-3">
    @if (loadingUsers()) {
      <div class="flex justify-center py-4">
        <span class="loading loading-spinner loading-sm text-primary"></span>
      </div>
    } @else if (users().length === 0) {
      <p class="text-sm text-base-content/50 text-center py-4">Cap usuari disponible</p>
    } @else {
      <ul class="menu menu-sm p-1" role="listbox" aria-label="Llista d'usuaris">
        @for (user of users(); track user.id) {
          <li role="option" [attr.aria-selected]="selectedUser()?.id === user.id">
            <button
              type="button"
              class="flex items-center justify-between w-full"
              [class.active]="selectedUser()?.id === user.id"
              [class.text-primary-content]="selectedUser()?.id === user.id"
              (click)="selectUser(user)"
            >
              <div class="flex flex-col items-start">
                @if (user.person) {
                  <span class="text-sm font-medium">{{ user.person.alias }}</span>
                  <span class="text-xs opacity-70">{{ user.email }}</span>
                } @else {
                  <span class="text-sm">{{ user.email }}</span>
                }
              </div>
              <div class="flex items-center gap-1">
                @if (!user.isActive) {
                  <lib-badge variant="warning" size="xs">Pendent d'activar</lib-badge>
                }
                @if (roleLabel(user.role); as label) {
                  <lib-badge size="xs" outline>{{ label }}</lib-badge>
                }
              </div>
            </button>
          </li>
        }
      </ul>
    }
  </div>

  <div modalFooter>
    <lib-button variant="ghost" size="sm" [disabled]="saving()" (clicked)="close()">Cancel·la</lib-button>
    <lib-button variant="primary" size="sm" [disabled]="!selectedUser()" [loading]="saving()" (clicked)="save()">
      Afegeix
    </lib-button>
  </div>
</lib-modal>
