<lib-modal [open]="true" title="Persona nova" (closed)="close()">
  @if (error()) {
    <div class="alert alert-error text-sm mb-4">
      <span>{{ error() }}</span>
    </div>
  }

  <lib-input
    label="Àlies"
    placeholder="Àlies"
    [ngModel]="alias()"
    (ngModelChange)="alias.set($event)"
    [disabled]="creating()"
    (keydown.enter)="create()"
  />

  <div modalFooter>
    <lib-button variant="ghost" size="sm" [disabled]="creating()" (clicked)="close()">Cancel·la</lib-button>
    <lib-button variant="primary" size="sm" [disabled]="!alias().trim()" [loading]="creating()" (clicked)="create()">Crea</lib-button>
  </div>
</lib-modal>
