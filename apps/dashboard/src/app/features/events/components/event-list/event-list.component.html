<div class="flex flex-col gap-4">

  <!-- Capçalera -->
  <app-page-header [title]="pageTitle()" [count]="totalEvents()">
    <lib-button variant="primary" size="sm" (clicked)="showCreateModal.set(true)">
      <lucide-icon name="Plus" [size]="14" />
      {{ eventType() === EventType.ASSAIG ? 'Assaig nou' : 'Actuació nova' }}
    </lib-button>
    <lib-button variant="warning" outline size="sm" (clicked)="navigateToSync()">
      <lucide-icon name="RefreshCw" [size]="14" />
      Sincronitza
    </lib-button>
  </app-page-header>

  <!-- Filtres -->
  <app-filter-bar [hasActiveFilters]="hasFilterChips()" (clearFilters)="clearFilters()">

    <!-- Cerca -->
    <div class="w-full sm:w-64">
      <lib-input
        label="Cerca"
        placeholder="Títol, lloc..."
        [icon]="SearchIcon"
        [(ngModel)]="searchInput"
        (ngModelChange)="onSearchChange($event)"
      />
    </div>

    <!-- Temporada -->
    @if (seasons().length > 0) {
      <div class="w-full sm:w-48">
        <lib-select
          label="Temporada"
          [ngModel]="selectedSeasonId() ?? ''"
          (ngModelChange)="onSeasonChange($event)"
        >
          <option value="">Totes</option>
          @for (season of seasons(); track season.id) {
            <option [value]="season.id">{{ season.name }}</option>
          }
        </lib-select>
      </div>
    }

    <!-- Filtre temporal -->
    <div class="w-full sm:w-40">
      <lib-select
        label="Quan"
        [ngModel]="timeFilter()"
        (ngModelChange)="onTimeFilterChange($event)"
      >
        <option value="all">Tots</option>
        <option value="upcoming">Propers</option>
        <option value="past">Passats</option>
      </lib-select>
    </div>

  </app-filter-bar>

  <!-- Filtres actius + toggle columnes -->
  <div class="flex flex-wrap items-start justify-between gap-3">
    <app-active-filters
      [filters]="activeFilterChips()"
      (removeFilter)="onRemoveFilterChip($event)"
    />
    <app-column-toggle
      [columns]="ALL_EVENT_COLUMNS"
      [visibleKeys]="visibleColumnKeys()"
      (toggleColumn)="toggleColumn($event)"
    />
  </div>

  <!-- Taula -->
  <app-data-table
    [items]="events()"
    [columns]="tableColumns()"
    [visibleColumns]="visibleColumnKeys()"
    [sortBy]="sortBy()"
    [sortOrder]="sortOrder()"
    [loading]="loading()"
    [groupSeparator]="groupSeparator()"
    [rowActions]="tableRowActions()"
    (rowClick)="navigateToEvent($any($event).id)"
    (sortChange)="onSortChangeFromTable($event)"
  />

  <!-- Estat buit -->
  @if (!loading() && events().length === 0) {
    <lib-empty-state
      [icon]="eventType() === EventType.ASSAIG ? DOMAIN_ICONS.ASSAIG : DOMAIN_ICONS.ACTUACIO"
      [message]="'No s\'han trobat ' + (eventType() === EventType.ASSAIG ? 'assajos' : 'actuacions') + ' amb els filtres actuals'"
      actionLabel="Netejar filtres"
      (clicked)="clearFilters()"
    />
  }

  <!-- Paginació -->
  @if (totalEvents() > 0) {
    <app-pagination
      [page]="page()"
      [totalPages]="totalPages()"
      [limit]="limit()"
      [totalItems]="totalEvents()"
      (pageChange)="goToPage($event)"
      (limitChange)="onLimitChange($event)"
    />
  }

</div>

<!-- Modal creació event -->
@if (showCreateModal()) {
  <app-event-form-modal
    [presetEventType]="eventType()"
    (saved)="onEventCreated($event)"
    (closed)="showCreateModal.set(false)"
  />
}
