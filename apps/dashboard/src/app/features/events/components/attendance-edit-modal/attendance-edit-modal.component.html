<lib-modal [open]="true" [title]="'Notes de ' + attendance().person.alias" (closed)="onClose()">

  <p class="text-sm text-base-content/60 -mt-2 mb-3">{{ attendance().person.name }} {{ attendance().person.firstSurname }}</p>

  @if (errorMessage()) {
    <div class="mb-4">
      <lib-alert variant="error" dense>{{ errorMessage() }}</lib-alert>
    </div>
  }

  <div class="form-control mb-2">
    <label class="label" for="attendance-notes">
      <span class="label-text font-medium">Notes d'assistència</span>
    </label>
    <lib-textarea
      id="attendance-notes"
      [rows]="3"
      placeholder="Motiu de la no assistència, observacions..."
      [ngModel]="editedNotes()"
      (ngModelChange)="editedNotes.set($event || null)"
    />
  </div>

  <div modalFooter class="w-full flex items-center justify-end gap-2">
    <lib-button variant="ghost" size="sm" (clicked)="onClose()">Cancel·la</lib-button>
    <lib-button
      variant="primary"
      size="sm"
      [disabled]="!hasChanges() || saving()"
      [loading]="saving()"
      (clicked)="onSave()"
    >
      Alça
    </lib-button>
  </div>
</lib-modal>
