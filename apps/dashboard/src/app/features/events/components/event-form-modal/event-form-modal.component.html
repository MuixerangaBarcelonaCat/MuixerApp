<lib-modal [open]="true" [title]="modalTitle()" (closed)="onClose()">
  @if (errorMessage()) {
    <div class="alert alert-error shadow-raised mb-4" role="alert">
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-4" novalidate>

    <!-- Títol -->
    <div class="col-span-full">
      <lib-input
        label="Títol"
        required
        formControlName="title"
        [placeholder]="presetEventType() === EventType.ASSAIG
          ? 'Assaig general...'
          : 'Trobada de Muixerangues...'"
        [errorText]="fieldError('title') ?? undefined"
      />
    </div>

    <!-- Tipus -->
    <lib-select label="Tipus" required formControlName="eventType">
      <option [value]="EventType.ASSAIG">Assaig</option>
      <option [value]="EventType.ACTUACIO">Actuació</option>
    </lib-select>

    <!-- Data -->
    <lib-input
      label="Data"
      required
      type="date"
      formControlName="date"
      [errorText]="fieldError('date') ?? undefined"
    />

    <!-- Hora inici (raw: lib-input's InputType has no "time" — component-API gap, not forced) -->
    <div class="form-control">
      <label class="label" for="startTime">
        <span class="label-text font-medium">Hora inici</span>
      </label>
      <input
        id="startTime"
        type="time"
        class="input input-bordered"
        [class.input-error]="fieldError('startTime')"
        formControlName="startTime"
      />
      @if (fieldError('startTime')) {
        <div class="label"><span class="label-text-alt text-error">{{ fieldError('startTime') }}</span></div>
      }
    </div>

    <!-- Lloc -->
    <lib-input
      label="Lloc"
      formControlName="location"
      placeholder="Local de la colla..."
    />

    <!-- URL ubicació -->
    <lib-input
      label="URL mapa"
      type="url"
      formControlName="locationUrl"
      placeholder="https://maps.google.com/..."
    />

    <!-- Temporada -->
    <div class="col-span-full">
      <lib-select label="Temporada" formControlName="seasonId">
        <option value="">— Sense temporada —</option>
        @for (season of allSeasons(); track season.id) {
          <option [value]="season.id">{{ season.name }}</option>
        }
      </lib-select>
    </div>

    <!-- Descripció -->
    <div class="form-control col-span-full">
      <label class="label" for="description">
        <span class="label-text font-medium">Descripció</span>
      </label>
      <textarea
        id="description"
        class="textarea textarea-bordered"
        formControlName="description"
        rows="3"
        placeholder="Detalls de l'esdeveniment..."
      ></textarea>
    </div>

    <!-- Compta per estadístiques -->
    <div class="form-control col-span-full">
      <label class="label cursor-pointer justify-start gap-3">
        <input type="checkbox" class="checkbox" formControlName="countsForStatistics" />
        <span class="label-text">Compta per a estadístiques</span>
      </label>
    </div>

  </form>

  <div modalFooter>
    <lib-button variant="ghost" size="sm" (clicked)="onClose()">Cancel·la</lib-button>
    <lib-button
      variant="primary"
      size="sm"
      [disabled]="form.invalid || saving()"
      [loading]="saving()"
      (clicked)="onSubmit()"
    >
      {{ isEditMode() ? 'Alça canvis' : 'Crea esdeveniment' }}
    </lib-button>
  </div>
</lib-modal>
