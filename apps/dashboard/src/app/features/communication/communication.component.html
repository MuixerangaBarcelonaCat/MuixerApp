<div class="space-y-4 max-w-3xl mx-auto">
  <div>
    <h1 class="text-xl font-bold text-base-content">Comunicació</h1>
    <p class="text-xs text-base-content/50 mt-0.5">Notícies i notificacions</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

    <a routerLink="news" class="card bg-base-100 shadow-sm hover:shadow-md transition-shadow cursor-pointer border-l-4 border-primary">
      <div class="card-body p-4">
        <lucide-icon name="Newspaper" [size]="24" class="text-primary mb-1" />
        <h3 class="font-semibold">Notícies</h3>
        <p class="text-xs text-base-content/50">Notícies per a la pàgina d'inici de l'aplicació</p>
      </div>
    </a>

    <a routerLink="notifications" class="card bg-base-100 shadow-sm hover:shadow-md transition-shadow cursor-pointer border-l-4 border-secondary">
      <div class="card-body p-4">
        <lucide-icon name="Bell" [size]="24" class="text-secondary mb-1" />
        <h3 class="font-semibold">Notificacions push</h3>
        <p class="text-xs text-base-content/50">Envia notificacions push als membres</p>
      </div>
    </a>

    <a routerLink="notifications/devices" class="card bg-base-100 shadow-sm hover:shadow-md transition-shadow cursor-pointer border-l-4 border-accent">
      <div class="card-body p-4">
        <lucide-icon name="Smartphone" [size]="24" class="text-accent mb-1" />
        <h3 class="font-semibold">Dispositius</h3>
        <p class="text-xs text-base-content/50">Membres subscrits a notificacions push</p>
      </div>
    </a>

  </div>
</div>
