<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <title>MuixerApp</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Matches the placeholder colla's generated `primary` token (see the shirt color passed to
         generateCollaTheme(...) in tailwind.config.ts) — expressed as the same oklch() this whole
         token system already uses, not a hex snapshot, so it isn't raw-hex drift for lint:tokens
         to flag. Static HTML can't read the live theme, so this can still silently go stale if
         the colla config in tailwind.config.ts ever changes — see DEBT.md F12. Keep
         manifest.webmanifest's theme_color in sync with this value. -->
    <meta name="theme-color" content="oklch(62% 0.18 220.71)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MuixerApp" />
    <!-- Applies a per-device theme choice before first paint (no light flash). With nothing
         stored, no data-theme is set and DaisyUI follows prefers-color-scheme in pure CSS.
         Mirrors THEME_STORAGE_KEY/THEME_NAMES in libs/ui (theme-names.ts) — index-html.spec.ts
         keeps them in sync. -->
    <script>
      try {
        var theme = localStorage.getItem('muixer_theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = 'colla-barcelona-' + theme;
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-base-200 antialiased">
    <app-root></app-root>
  </body>
</html>
