<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <title>MuixerApp</title>
    <base href="/" />
    <!-- maximum-scale=1 stops iOS zooming in on a focused input (it does for any font-size under
         16px), a zoom the app couldn't undo since pinch-zoom is disabled. iOS still lets the user
         pinch-zoom despite it; Android honours it, which matches the app's no-zoom policy. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <!-- Matches the placeholder colla's generated `primary` token (see the shirt color passed to
         generateCollaTheme(...) in tailwind.config.ts) — expressed as the same oklch() this whole
         token system already uses, not a hex snapshot, so it isn't raw-hex drift for lint:tokens
         to flag. Static HTML can't read the live theme, so this can still silently go stale if
         the colla config in tailwind.config.ts ever changes — see DEBT.md F12. Keep
         manifest.webmanifest's theme_color in sync with this value. -->
    <meta name="theme-color" content="oklch(62% 0.18 220.71)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`, not `black-translucent`: drawing the page under the status bar made iOS 26 blur
         the top of the screen and leave a status-bar-high blank strip under the bottom tab bar.
         iOS reads this only when the app is added to the home screen: reinstall to see a change. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MuixerApp" />
    <!-- Applies a per-device theme choice before first paint (no light flash). With nothing
         stored, no data-theme is set and DaisyUI follows prefers-color-scheme in pure CSS.
         Mirrors THEME_STORAGE_KEY/THEME_NAMES in libs/ui (theme-names.ts) — index-html.spec.ts
         keeps them in sync. -->
    <script>
      try {
        var theme = localStorage.getItem('muixer_theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = 'colla-barcelona-' + theme;
        }
      } catch (e) {}
      // Fires once per page load, possibly before Angular boots; InstallPromptService adopts it.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__muixerInstallPrompt = e;
      });
    </script>
  </head>
  <body class="bg-base-200 antialiased">
    <!-- Pre-boot placeholder: covers the gap between the OS splash and Angular's first render
         (Angular replaces app-root's content on bootstrap). Tailwind scans this file and the
         global stylesheet is render-blocking, so token classes and dark mode already apply. -->
    <app-root>
      <div class="fixed inset-0 grid place-items-center bg-base-200" aria-busy="true">
        <img
          src="icons/icon-192.png"
          width="96"
          height="96"
          alt="MuixerApp"
          class="rounded-box motion-safe:animate-pulse"
        />
      </div>
    </app-root>
  </body>
</html>
