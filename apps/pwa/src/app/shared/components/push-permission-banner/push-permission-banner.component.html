@if (shouldShow()) {
  <div
    class="fixed bottom-20 left-4 right-4 z-chrome alert shadow-overlay bg-base-100 border border-base-300"
    role="alert"
    aria-live="polite"
  >
    <lucide-icon [img]="Bell" [size]="20" class="shrink-0 text-primary" aria-hidden="true" />
    <div class="flex-1">
      <p class="text-sm font-medium">Activa les notificacions</p>
      <p class="text-xs text-base-content/60">Per saber quan hi ha assaig o actuació</p>
    </div>
    <div class="flex gap-2">
      <lib-button variant="ghost" size="sm" ariaLabel="No activar ara" (clicked)="dismiss()">
        Ara no
      </lib-button>
      <lib-button size="sm" (clicked)="activate()">Activa</lib-button>
    </div>
  </div>
}
