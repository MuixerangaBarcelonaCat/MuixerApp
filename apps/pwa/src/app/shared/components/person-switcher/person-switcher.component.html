<div class="dropdown">
  <lib-button variant="ghost" size="sm" data-testid="person-switcher-trigger">
    <span class="truncate max-w-32">{{ selectedLabel() }}</span>
    <lucide-icon [img]="ChevronDown" [size]="16" />
  </lib-button>
  <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-dropdown w-48 p-2 shadow-overlay">
    @for (item of items(); track item.personId) {
      <li>
        <button
          type="button"
          [class.bg-primary]="item.personId === selectedId()"
          [class.text-primary-content]="item.personId === selectedId()"
          (click)="select(item.personId)"
        >
          {{ item.displayName }}
        </button>
      </li>
    }
  </ul>
</div>
