<div class="dropdown">
  <div tabindex="0" role="button" class="btn btn-ghost btn-sm gap-1 px-2">
    <span class="truncate max-w-32">{{ selectedLabel() }}</span>
    <lucide-icon [img]="ChevronDown" [size]="16" />
  </div>
  <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-10 w-48 p-2 shadow-sm">
    @for (item of items(); track item.personId) {
      <li>
        <button
          type="button"
          [class.bg-primary]="item.personId === selectedId()"
          [class.text-primary-content]="item.personId === selectedId()"
          (click)="select(item.personId)"
        >
          {{ item.displayName }}
        </button>
      </li>
    }
  </ul>
</div>
