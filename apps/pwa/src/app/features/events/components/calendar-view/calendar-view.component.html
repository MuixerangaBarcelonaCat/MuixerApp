<div class="mb-4">
  <div class="flex items-center justify-between mb-3">
    <button
      type="button"
      class="btn btn-ghost btn-sm btn-circle"
      aria-label="Mes anterior"
      (click)="previousMonth()"
    >
      <lucide-icon [img]="ChevronLeft" [size]="20" />
    </button>
    <h3 class="text-sm font-semibold">{{ monthLabel() }}</h3>
    <button
      type="button"
      class="btn btn-ghost btn-sm btn-circle"
      aria-label="Mes següent"
      (click)="nextMonth()"
    >
      <lucide-icon [img]="ChevronRight" [size]="20" />
    </button>
  </div>

  <div role="grid" aria-label="Calendari mensual">
    <div class="grid grid-cols-7 text-center mb-1" role="row">
      @for (header of dayHeaders; track header.short) {
        <div
          class="text-xs font-medium text-base-content/50 py-1"
          role="columnheader"
          [attr.aria-label]="header.full"
        >
          {{ header.short }}
        </div>
      }
    </div>
    @for (week of calendarGrid(); track $index) {
      <div class="grid grid-cols-7" role="row">
        @for (day of week; track day.date) {
          <button
            type="button"
            class="flex flex-col items-center justify-start py-1.5 min-h-[3rem] rounded-lg transition-colors"
            [class.text-base-content/30]="!day.isCurrentMonth"
            [class.pointer-events-none]="!day.isCurrentMonth"
            [class.ring-2]="day.isToday && selectedDate() !== day.date"
            [class.ring-primary]="day.isToday && selectedDate() !== day.date"
            [class.bg-primary]="selectedDate() === day.date"
            [class.text-primary-content]="selectedDate() === day.date"
            role="gridcell"
            [attr.aria-selected]="selectedDate() === day.date"
            [attr.aria-label]="dayAriaLabel(day)"
            [attr.data-date]="day.date"
            [tabindex]="day.date === focusedDate() ? 0 : -1"
            (click)="selectDay(day)"
            (keydown)="onDayKeydown($event, day)"
          >
            <span class="text-sm leading-tight">{{ day.dayNumber }}</span>
            @if (day.events.length > 0) {
              <div class="flex gap-0.5 mt-0.5">
                @for (ev of day.events; track ev.id) {
                  <span
                    class="w-2 h-2 rounded-full"
                    [class]="dotClasses(ev)"
                    aria-hidden="true"
                  ></span>
                }
              </div>
            }
          </button>
        }
      </div>
    }
  </div>
</div>
