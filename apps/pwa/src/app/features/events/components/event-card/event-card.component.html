<div
  class="card bg-base-100 shadow-sm border-l-4 cursor-pointer"
  [class]="accentClass()"
  role="article"
  tabindex="0"
  [attr.aria-label]="cardTitle() + ', ' + cardSubtitle()"
  (click)="navigateToDetail()"
  (keydown.enter)="navigateToDetail()"
>
  <div class="card-body p-4">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0 flex-1">
        <h3 class="card-title text-base truncate">{{ cardTitle() }}</h3>
        <p class="text-sm text-base-content/60">{{ cardSubtitle() }}</p>
      </div>
      <app-attendance-button
        [eventId]="event().id"
        [status]="event().myAttendance?.status ?? null"
        [disabled]="isPast()"
        (statusChanged)="onAttendanceChanged($event)"
        (click)="$event.stopPropagation()"
        (keydown.enter)="$event.stopPropagation()"
      />
    </div>

    <div class="flex items-center gap-4 mt-2 text-xs text-base-content/50">
      @if (event().startTime) {
        <span class="flex items-center gap-1">
          <lucide-icon [img]="Clock" [size]="14" aria-hidden="true" />
          {{ event().startTime | slice:0:5 }}
        </span>
      }
      @if (event().location) {
        <span class="flex items-center gap-1">
          <lucide-icon [img]="MapPin" [size]="14" aria-hidden="true" />
          {{ event().location }}
        </span>
      }
    </div>
  </div>
</div>
