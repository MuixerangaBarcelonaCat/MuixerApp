<div
  class="card bg-base-100 shadow-sm border-l-4 cursor-pointer"
  [class]="accentClass()"
  role="article"
  tabindex="0"
  [attr.aria-label]="cardTitle() + ', ' + cardSubtitle()"
  (click)="navigateToDetail()"
  (keydown.enter)="navigateToDetail()"
>
  <div class="card-body p-4">
    <h3 class="card-title text-base mb-0">{{ cardTitle() }}</h3>

    <div class="flex items-stretch justify-between gap-2">
      <div class="min-w-0 flex-1 flex flex-col justify-end gap-1">
        <p class="text-sm text-base-content/60">{{ cardSubtitle() }}</p>

        <div class="flex flex-col gap-0.5 text-xs text-base-content/50">
          @if (event().startTime) {
            <span class="flex items-center gap-1">
              <lucide-icon [img]="Clock" [size]="14" aria-hidden="true" />
              {{ event().startTime | slice:0:5 }}
            </span>
          }
          @if (event().location) {
            <span class="flex items-center gap-1 min-w-0">
              <lucide-icon [img]="MapPin" [size]="14" class="shrink-0" aria-hidden="true" />
              <span class="truncate">{{ event().location }}</span>
            </span>
          }
        </div>
      </div>

      <div class="flex flex-col items-end gap-2 shrink-0">
        @for (row of event().managedAttendances; track row.personId) {
          <div class="flex items-center gap-2">
            @if (event().managedAttendances.length > 1) {
              <span class="managed-person-name text-xs font-medium text-base-content/70 truncate">
                {{ row.displayName }}
              </span>
            }
            <app-attendance-button
              [eventId]="event().id"
              [personId]="row.personId"
              [status]="row.attendance?.status ?? null"
              [disabled]="isPast()"
              [ariaContext]="event().managedAttendances.length > 1 ? cardTitle() + ' — ' + row.displayName : ''"
              (statusChanged)="onAttendanceChanged(row.personId, $event)"
              (click)="$event.stopPropagation()"
              (keydown.enter)="$event.stopPropagation()"
            />
          </div>
        }
      </div>
    </div>
  </div>
</div>
