<div class="p-4 flex flex-col gap-4">
  <div>
    <h1 class="text-xl font-serif font-bold">Completeu les dades de la xicalla</h1>
    @if (current()) {
      <p class="text-sm text-base-content/60 mt-1">
        Completant dades: {{ position() }} de {{ initialTotal() }}
      </p>
    }
  </div>

  @if (loading()) {
    <div class="flex justify-center py-8"><span class="loading loading-spinner"></span></div>
  } @else if (current(); as dependent) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <app-person-data-fields [formGroup]="form" [heading]="dependent.alias" />

      @if (errorMessage()) {
        <lib-alert variant="error" dense>{{ errorMessage() }}</lib-alert>
      }

      <lib-button
        type="submit"
        variant="primary"
        fullWidth
        [disabled]="form.invalid"
        [loading]="isSubmitting()"
      >
        @if (isSubmitting()) {
          S'està desant...
        } @else {
          Desa i continua
        }
      </lib-button>
    </form>
  }
</div>
