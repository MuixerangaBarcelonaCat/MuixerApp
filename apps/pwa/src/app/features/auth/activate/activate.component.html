<div
  class="min-h-screen bg-base-200 flex flex-col items-center p-6"
  style="
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  "
>
  <div class="text-center my-8">
    <h1 class="text-2xl font-bold text-base-content">MuixerApp</h1>
    <p class="text-sm text-base-content/50 mt-1">Activa el teu compte</p>
  </div>

  <div class="card bg-base-100 shadow-lg w-full max-w-md">
    <div class="card-body gap-5">
      @if (invalidLink()) {
        <div class="alert alert-error text-sm py-2" role="alert">
          <lucide-icon [img]="AlertCircle" [size]="16" />
          <span>Este enllaç d'invitació no és vàlid o ha caducat.</span>
        </div>
        <a routerLink="/login" class="link link-hover text-sm text-center text-base-content/60">
          Torna a l'inici de sessió
        </a>
      } @else if (loading()) {
        <div class="flex justify-center py-8"><span class="loading loading-spinner"></span></div>
      } @else {
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
          <label class="form-control w-full" for="activate-email">
            <div class="label pb-1"><span class="label-text font-medium">Correu electrònic</span></div>
            <input
              id="activate-email"
              type="email"
              class="input input-bordered text-sm h-11"
              formControlName="email"
              autocomplete="email"
              inputmode="email"
            />
          </label>

          <label class="form-control w-full" for="activate-password">
            <div class="label pb-1"><span class="label-text font-medium">Contrasenya</span></div>
            <input
              id="activate-password"
              type="password"
              class="input input-bordered text-sm h-11"
              formControlName="password"
              autocomplete="new-password"
            />
            @if (form.get('password')?.hasError('minlength') && form.get('password')?.touched) {
              <div class="label pt-1">
                <span class="label-text-alt text-error" role="alert">La contrasenya ha de tindre almenys 8 caràcters</span>
              </div>
            }
          </label>

          <label class="form-control w-full" for="activate-confirm-password">
            <div class="label pb-1"><span class="label-text font-medium">Confirmeu la contrasenya</span></div>
            <input
              id="activate-confirm-password"
              type="password"
              class="input input-bordered text-sm h-11"
              formControlName="confirmPassword"
              autocomplete="new-password"
            />
            @if (form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched) {
              <div class="label pt-1">
                <span class="label-text-alt text-error" role="alert">Les contrasenyes no coincideixen</span>
              </div>
            }
          </label>

          <div class="divider text-xs text-base-content/40">Dades personals</div>

          <app-person-data-fields [formGroup]="form.controls.personalData" />

          <div class="divider text-xs text-base-content/40">Política de privacitat</div>

          <div class="max-h-40 overflow-y-auto rounded-box bg-base-200 p-3 text-sm whitespace-pre-wrap">{{ context()?.legalDocument?.content }}</div>

          <label class="label cursor-pointer justify-start gap-3">
            <input type="checkbox" class="checkbox checkbox-sm" formControlName="legalAccepted" />
            <span class="label-text">He llegit i accepte la política de privacitat</span>
          </label>

          @if (errorMessage()) {
            <div class="alert alert-error text-sm py-2" role="alert">
              <lucide-icon [img]="AlertCircle" [size]="16" />
              <span>{{ errorMessage() }}</span>
            </div>
          }

          <button
            type="submit"
            class="btn btn-primary w-full h-12 text-base"
            [disabled]="form.invalid || isSubmitting()"
          >
            @if (isSubmitting()) {
              <span class="loading loading-spinner loading-sm"></span>
              S'està activant el compte...
            } @else {
              Activa el compte
            }
          </button>
        </form>
      }
    </div>
  </div>
</div>
