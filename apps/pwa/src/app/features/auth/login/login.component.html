<div
  class="min-h-screen bg-base-200 flex flex-col items-center justify-center p-6"
  style="
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  "
>
  <!-- Branding -->
  <div class="text-center mb-8">
    @if (!logoError()) {
      <img
        src="images/logoMuixe.png"
        alt="Logo MuixerApp"
        class="w-28 h-28 mx-auto mb-4 object-contain"
        (error)="logoError.set(true)"
      />
    }
    <h1 class="text-2xl font-bold text-base-content">MuixerApp</h1>
    <p class="text-sm text-base-content/50 mt-1">Muixeranga de Barcelona</p>
  </div>

  <!-- Login card -->
  <div class="card bg-base-100 shadow-lg w-full max-w-sm">
    <div class="card-body gap-5">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <lib-input
          label="Correu electrònic"
          type="email"
          size="md"
          [icon]="Mail"
          placeholder="nom@exemple.com"
          formControlName="email"
          autocomplete="username"
          name="username"
          [errorText]="
            form.get('email')?.invalid && form.get('email')?.touched
              ? 'Correu electrònic no vàlid'
              : undefined
          "
        />

        <lib-input
          label="Contrasenya"
          type="password"
          size="md"
          [icon]="Lock"
          placeholder="••••••••"
          formControlName="password"
          autocomplete="current-password"
          name="password"
        />

        @if (errorMessage()) {
          <div class="alert alert-error text-sm py-2" role="alert">
            <lucide-icon [img]="AlertCircle" [size]="16" />
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <button
          type="submit"
          class="btn btn-primary w-full h-12 text-base"
          [disabled]="form.invalid || isLoading()"
        >
          @if (isLoading()) {
            <span class="loading loading-spinner loading-sm"></span>
            S'està iniciant la sessió...
          } @else {
            Entra
          }
        </button>
      </form>

      <p class="text-xs text-center text-base-content/40 mt-2">
        <a routerLink="/forgot-password" class="link link-hover">
          Heu oblidat la contrasenya?
        </a>
      </p>
    </div>
  </div>
</div>
