<div
  class="min-h-screen bg-base-200 flex flex-col items-center justify-center p-6"
  style="
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  "
>
  <!-- Branding -->
  <div class="text-center mb-8">
    @if (!logoError()) {
      <img
        src="images/logoMuixe.png"
        alt="Logo MuixerApp"
        class="w-28 h-28 mx-auto mb-4 object-contain"
        (error)="logoError.set(true)"
      />
    }
    <h1 class="text-2xl font-serif font-bold text-base-content">MuixerApp</h1>
    <p class="text-sm text-base-content/50 mt-1">Muixeranga de Barcelona</p>
  </div>

  <!-- Login card -->
  <div class="card bg-base-100 shadow-modal w-full max-w-sm">
    <div class="card-body gap-5">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <lib-input
          label="Correu electrònic"
          type="email"
          inputMode="email"
          size="md"
          [icon]="Mail"
          placeholder="nom@exemple.com"
          formControlName="email"
          autocomplete="username"
          name="username"
          [errorText]="
            form.get('email')?.invalid && form.get('email')?.touched
              ? 'Correu electrònic no vàlid'
              : undefined
          "
        />

        <lib-input
          label="Contrasenya"
          type="password"
          size="md"
          [icon]="Lock"
          placeholder="••••••••"
          formControlName="password"
          autocomplete="current-password"
          name="password"
        />

        @if (errorMessage()) {
          <lib-alert variant="error" dense>{{ errorMessage() }}</lib-alert>
        }

        <lib-button
          type="submit"
          variant="primary"
          fullWidth
          [disabled]="form.invalid"
          [loading]="isLoading()"
        >
          @if (isLoading()) {
            S'està iniciant la sessió...
          } @else {
            Entra
          }
        </lib-button>
      </form>

      <p class="text-xs text-center text-base-content/40 mt-2">
        <a routerLink="/forgot-password" class="link link-hover">
          Heu oblidat la contrasenya?
        </a>
      </p>
    </div>
  </div>
</div>
