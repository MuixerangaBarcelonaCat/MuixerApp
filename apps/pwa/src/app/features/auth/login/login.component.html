<div
  class="min-h-screen bg-base-200 flex flex-col items-center justify-center p-6"
  style="
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  "
>
  <!-- Branding -->
  <div class="text-center mb-8">
    <img
      src="images/logoMuixe.png"
      alt="Logo MuixerApp"
      class="w-28 h-28 mx-auto mb-4 object-contain"
      onerror="this.style.display='none'"
    />
    <h1 class="text-2xl font-bold text-base-content">MuixerApp</h1>
    <p class="text-sm text-base-content/50 mt-1">Muixeranga de Barcelona</p>
  </div>

  <!-- Login card -->
  <div class="card bg-base-100 shadow-lg w-full max-w-sm">
    <div class="card-body gap-5">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <label class="form-control w-full" for="login-email">
          <div class="label pb-1">
            <span class="label-text font-medium">Correu electrònic</span>
          </div>
          <div
            class="input input-bordered flex items-center gap-2"
            [class.input-error]="
              form.get('email')?.invalid && form.get('email')?.touched
            "
          >
            <lucide-icon
              [img]="Mail"
              [size]="16"
              class="text-base-content/40 shrink-0"
            />
            <input
              id="login-email"
              type="email"
              class="grow bg-transparent outline-none text-sm"
              placeholder="nom@exemple.com"
              formControlName="email"
              autocomplete="email"
              inputmode="email"
            />
          </div>
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <div class="label pt-1">
              <span class="label-text-alt text-error" role="alert">
                Correu electrònic no vàlid
              </span>
            </div>
          }
        </label>

        <label class="form-control w-full" for="login-password">
          <div class="label pb-1">
            <span class="label-text font-medium">Contrasenya</span>
          </div>
          <div
            class="input input-bordered flex items-center gap-2"
            [class.input-error]="
              form.get('password')?.invalid && form.get('password')?.touched
            "
          >
            <lucide-icon
              [img]="Lock"
              [size]="16"
              class="text-base-content/40 shrink-0"
            />
            <input
              id="login-password"
              type="password"
              class="grow bg-transparent outline-none text-sm"
              placeholder="••••••••"
              formControlName="password"
              autocomplete="current-password"
            />
          </div>
        </label>

        @if (errorMessage()) {
          <div class="alert alert-error text-sm py-2" role="alert">
            <lucide-icon [img]="AlertCircle" [size]="16" />
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <button
          type="submit"
          class="btn btn-primary w-full h-12 text-base"
          [disabled]="form.invalid || isLoading()"
        >
          @if (isLoading()) {
            <span class="loading loading-spinner loading-sm"></span>
            Entrant...
          } @else {
            Entra
          }
        </button>
      </form>

      <p class="text-xs text-center text-base-content/40 mt-2">
        Has oblidat la contrasenya? Contacta amb l'equip tècnic.
      </p>
    </div>
  </div>
</div>
